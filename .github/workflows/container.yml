name: Test and publish MCP image

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime and test dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps .
          python -m pip install 'pytest>=8,<9' pytest-asyncio pytest-cov pytest-timeout respx
      - name: Run tests without Kaiten credentials
        run: python -m pytest --ignore=tests/test_e2e_scenario.py --ignore=tests/test_e2e_expanded.py -q

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build stdio image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: baked-stdio
          platforms: linux/amd64
          load: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Kaiten MCP
      - name: Verify stdio image without credentials or network
        run: python3 scripts/smoke-stdio.py ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
      - name: Verify personal HTTP startup and authentication without network
        run: python3 scripts/smoke-http.py ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
      - name: Publish verified image
        run: docker push ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
      - name: Record immutable image reference
        run: |
          docker image inspect --format '{{index .RepoDigests 0}}' ghcr.io/${{ github.repository }}:sha-${{ github.sha }} >> "$GITHUB_STEP_SUMMARY"
